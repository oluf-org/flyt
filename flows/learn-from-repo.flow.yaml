version: 1
id: learn-from-repo
name: Learn from a repo
description: |
  Point it at any repository and a question. The fan-out reads the brief, picks
  how many readers it needs and what each one is for, then runs them in parallel
  — each told to look somewhere the others will not. Their findings are merged,
  and the result becomes queued work the loop can pick up. The final artifact
  keeps the merged findings, proposed tasks, and queue outcome together.

inputs:
  repo:
    type: repo
    label: Repository
    required: true
    description: Any git URL or a path to a repository on this machine. Cloned read-only and pinned.
  goal:
    type: text
    label: "What do you want to learn from it?"
    placeholder: e.g. how it recovers from a failed task, and what we should copy

nodes:
  orient:
    use: orient
    title: "Where are we standing?"
    effort: high
    goal: |
      Say what THIS project is and what relationship it has to the repository we
      are about to read: are we empty, building the same kind of thing, solving
      overlapping problems, or is there no real overlap? Read enough of both to
      argue it. Everything after you is aimed by your answer. This is a bounded
      survey, not the repository analysis: inspect the project manifests and
      guidance plus at most two load-bearing files from each side, then stop.
    worker: { provider: auto, model: deepseek/deepseek-v4-pro-0813 }
    maxToolIterations: 6
  read:
    type: fanout
    title: Read it, however many ways it takes
    goal: |
      Read the repository you have been given and answer the question in the
      brief. Ground every claim in a file and a line you actually opened:
      search first, then read the specific place. Say plainly what you could
      not determine rather than filling the gap.
    tools: [search_references, read_file]
    lanes:
      - { id: architecture, label: Architecture, intent: "how the thing is put together, and why", preset: standard, worker: { provider: auto, model: deepseek/deepseek-v4-pro-0813 } }
      - { id: wildcard, preset: wildcard, worker: { provider: auto, model: deepseek/deepseek-v4-pro-0813 } }
      - { id: adversarial, preset: standard, worker: { provider: auto, model: moonshotai/kimi-k3 } }
      - { id: contrarian, preset: contrarian, worker: { provider: auto, model: deepseek/deepseek-v4-pro-0813 } }
    maxLanes: 4
    maxToolIterations: 10
    plan: auto
    template: general-analysis
  synthesise:
    use: general-analysis
    title: Merge the reads
    effort: high
    instructions: |
      Several independent readings of one repository follow, each with a
      different slant. Merge them into one account: what is agreed, what only
      one lane saw, and what they contradict each other about. Keep the
      citations. Where two lanes disagree, say so rather than picking a winner
      silently.

      The orientation above says what THIS project is and how it relates to
      what was read. Use it: separate what is relevant here from what is not,
      say plainly where a finding describes something we have already solved,
      and drop what does not apply to us rather than carrying it forward.
    worker: { provider: auto, model: deepseek/deepseek-v4-pro-0813 }
    skills: [reference-transfer]
    requiresApproval: false
  plan:
    use: backlog-plan
    title: What we should actually do
    instructions: |
      Propose only work that this project should genuinely do as a result of
      what was read. Prefer three real tasks to ten plausible ones. Every task
      must be claimable on its own by someone who has not read the analysis.

      Prefer tasks that can LAND on their own. A dependency is a real
      statement — "this cannot be written until that exists" — and it is
      sometimes true, but a backlog where three tasks all wait on one is a
      queue that stops the moment that one stops. Seen exactly that: four
      tasks, three of them behind the first, the first parked, and the night
      ended after one attempt with three good tasks untouched. If the
      foundation genuinely must come first, say so and keep the chain short;
      otherwise write each task so it stands up alone, even when that means a
      little overlap between them.

      You can read this project — use that. Confirm every path you put in
      blastRadius, and take gates from the commands this project actually has.
      If the orientation says the relation is "unrelated", a short backlog or an
      honest "nothing here transfers" is the correct answer; do not manufacture
      work to avoid saying it.

      Whoever picks these tasks up will be standing in THIS project, weeks from
      now, with the analysis long gone. So whenever a task points at something
      in the repository you read, name it as `reference:<name>/<path>` and say
      in the goal that it lives there. A bare path reads as a file we have: a
      task saying "extract the evaluator from code_quality_manager.py" sends
      someone hunting through a workspace that has never contained it, and the
      only honest thing they can report is that the task is impossible.

      Every referenced file must also have a structured evidence entry in the
      task JSON: the claim being transferred, its full `reference:<name>/<path>`,
      an exact line number, and a short exact excerpt from that line. Re-open
      the file before emitting the plan. The Loop verifies these fields against
      the pinned clone and will queue nothing if any citation is stale or wrong.
    worker: { provider: auto, model: deepseek/deepseek-v4-pro-0813 }
    skills: [skill-authoring]
    maxToolIterations: 10
  work:
    type: loop
    title: Queue it
    maxTasks: 6
    waitFor: none

flow:
  - inputs.repo -> orient
  - inputs.goal -> orient
  - orient.summary -> read
  - read -> synthesise
  - orient -> synthesise
  - synthesise -> plan
  - orient -> plan
  - plan.tasks -> work
  - synthesise -> output
  - plan -> output
  - work -> output
  - input -> inputs
