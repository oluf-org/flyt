<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flyt</title>
    <script>
      // Set before first paint so the stored theme never flashes. This runs
      // before any module loads, so it cannot import core/brand.js — it is the
      // one place outside that file allowed to name the old brand, and the tag
      // on the line below is what exempts it from tests/brand.test.js.
      // App.jsx performs the actual key migration on mount.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('flyt-theme') ||
          localStorage.getItem('llmflow-theme') /* brand-legacy */ || 'light';
      } catch {}
    </script>
    <!-- The mark at its 16px cadence (src/logo.js), inlined as a data URI: a
         favicon is a network round-trip for ~600 bytes otherwise. Sage is baked
         in because a favicon has no CSS context for currentColor to inherit.
         Regenerate alongside the app icons — `npm run icons`. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2216%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cg%20stroke%3D%22%235b8c6e%22%20stroke-width%3D%220.89%22%20stroke-linecap%3D%22round%22%3E%3Cline%20x1%3D%226.08%22%20y1%3D%228.95%22%20x2%3D%225.12%22%20y2%3D%2210.61%22%2F%3E%3Cline%20x1%3D%225.12%22%20y1%3D%227.28%22%20x2%3D%222.56%22%20y2%3D%227.28%22%2F%3E%3Cline%20x1%3D%226.08%22%20y1%3D%225.62%22%20x2%3D%224.48%22%20y2%3D%222.85%22%2F%3E%3Cline%20x1%3D%228.00%22%20y1%3D%225.62%22%20x2%3D%229.92%22%20y2%3D%222.30%22%2F%3E%3Cline%20x1%3D%228.96%22%20y1%3D%227.28%22%20x2%3D%2213.44%22%20y2%3D%227.28%22%2F%3E%3Cline%20x1%3D%228.00%22%20y1%3D%228.95%22%20x2%3D%2210.56%22%20y2%3D%2213.38%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%224.48%22%20cy%3D%222.85%22%20r%3D%220.77%22%20fill%3D%22%235b8c6e%22%2F%3E%3Ccircle%20cx%3D%2210.56%22%20cy%3D%2213.38%22%20r%3D%220.77%22%20fill%3D%22%235b8c6e%22%2F%3E%3Ccircle%20cx%3D%227.04%22%20cy%3D%227.28%22%20r%3D%221.14%22%20fill%3D%22%235b8c6e%22%2F%3E%3C%2Fsvg%3E"
