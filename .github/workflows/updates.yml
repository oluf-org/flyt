name: Update service

on:
  push:
    branches: [main]
    paths: ['services/updates/**', '.github/workflows/updates.yml']
  pull_request:
    paths: ['services/updates/**', '.github/workflows/updates.yml', '.github/workflows/release*.yml', 'electron-builder.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/updates
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/updates/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run

  credentials:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/updates
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Check production R2 credentials
        run: node scripts/release.mjs check
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # The read-only Worker uses bindings, not S3 upload credentials. Validate
  # deployment independently so one credential failure does not hide another.
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/updates
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Deploy staging service
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test staging
        run: node scripts/smoke.mjs https://updates-staging.flyt.pro
      - name: Deploy production service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test production
        run: node scripts/smoke.mjs https://updates.flyt.pro
