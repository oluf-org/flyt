name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-windows-2025, blacksmith-6vcpu-macos-15, blacksmith-4vcpu-ubuntu-2404]
        node: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Deterministic work budgets; timing distributions are evidence, not
      # hardware-sensitive release gates on shared runners.
      - run: npm run perf:check
        env:
          FLYT_PERF_COUNTS: '10,100,500'
          FLYT_PERF_REPEATS: '3'
      - uses: actions/upload-artifact@v4
        if: always()
        # The measurements are also in the perf:check log. Artifact storage
        # availability must not prevent lint and package verification.
        continue-on-error: true
        with:
          name: performance-${{ matrix.os }}
          path: .flyt/performance/core.json
          include-hidden-files: true
          if-no-files-found: ignore
      - run: npm run lint
      # A renderer build is not an application package. --dir exercises the
      # platform packager without spending time on an installer; afterPack then
      # verifies that app.asar contains every runtime asset and shipped seed.
      - run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  dependencies:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # The dsh compatibility promise, checked against real published plugins at
  # pinned versions (D54). It runs inside `npm test` as well; it is called out
  # as its own job so that a red build says WHICH promise decayed, on a
  # dependency preview whose APIs are expected to move.
  compat:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:kernel
      - run: node --test tests/dshCompat.test.js
