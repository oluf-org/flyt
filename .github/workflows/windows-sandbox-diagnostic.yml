name: Windows sandbox diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:sandbox:win
      - name: Test real Windows sandbox as a standard user
        shell: powershell
        run: |
          wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true
          $testUser = 'flytsandboxci'
          # Keep this at 14 characters so legacy `net user` never prompts.
          # The account exists only for this ephemeral runner job.
          $plainPassword = 'Flyt!Aa1b2C3d4'
          $testRoot = Join-Path $env:SystemDrive 'flyt-sandbox-ci'
          try {
            net user $testUser $plainPassword /add /expires:never /passwordchg:no
            if ($LASTEXITCODE -ne 0) { throw "Could not create the sandbox test user ($LASTEXITCODE)." }
            New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
            icacls.exe $testRoot /grant "${testUser}:(OI)(CI)M" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not grant the test temp directory ($LASTEXITCODE)." }
            icacls.exe $pwd.Path /grant "${testUser}:(OI)(CI)RX" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not grant repository read access ($LASTEXITCODE)." }

            $stdoutPath = Join-Path $testRoot 'stdout.log'
            $stderrPath = Join-Path $testRoot 'stderr.log'
            $exitPath = Join-Path $testRoot 'exit-code.txt'
            $scriptPath = Join-Path $testRoot 'run-tests.cmd'
            @"
          @echo off
          set "FLYT_RELEASE_SANDBOX_E2E=1"
          set "TEMP=$testRoot"
          set "TMP=$testRoot"
          set "TMPDIR=$testRoot"
          cd /d "$($pwd.Path)"
          "$((Get-Command node).Source)" --test tests/executionWorldPlatform.test.js > "$stdoutPath" 2> "$stderrPath"
          echo %ERRORLEVEL% > "$exitPath"
          "@ | Set-Content $scriptPath -Encoding ASCII
            # Batch logon gives the standard user its own noninteractive
            # session, independent of the runner service's desktop ACLs.
            $action = New-ScheduledTaskAction -Execute $env:ComSpec -Argument "/c `"$scriptPath`"" -WorkingDirectory $pwd.Path
            $testUserSid = (Get-LocalUser -Name $testUser).SID.Value
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 5)
            Register-ScheduledTask -TaskName $testUser -Action $action -Settings $settings -User $testUserSid -Password $plainPassword -RunLevel Limited -Force | Out-Null
            Start-ScheduledTask -TaskName $testUser
            $deadline = (Get-Date).AddMinutes(1)
            while (!(Test-Path $exitPath)) {
              if ((Get-Date) -gt $deadline) {
                Get-WinEvent -LogName Microsoft-Windows-TaskScheduler/Operational -MaxEvents 15 | Format-List TimeCreated,Id,Message
                Get-ScheduledTaskInfo -TaskName $testUser | Format-List
                Get-ScheduledTask -TaskName $testUser | Format-List
                Get-Content $stdoutPath, $stderrPath -ErrorAction SilentlyContinue
                throw 'Windows sandbox tests did not complete within five minutes.'
              }
              Start-Sleep -Seconds 2
            }
            Get-Content $stdoutPath
            Get-Content $stderrPath
            $testExitCode = [int](Get-Content $exitPath)
            if ($testExitCode -ne 0) { throw "Windows sandbox tests failed ($testExitCode)." }
          }
          finally {
            Get-ScheduledTask -TaskName $testUser -ErrorAction SilentlyContinue | Stop-ScheduledTask
            Unregister-ScheduledTask -TaskName $testUser -Confirm:$false -ErrorAction SilentlyContinue
            net user $testUser /delete | Out-Null
          }
