name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a release tag from main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-windows-2025
            platform: windows
            build_args: --win --x64
          - os: blacksmith-6vcpu-macos-15
            platform: mac
            # macos-latest is ARM today; build Intel explicitly as well so the
            # release does not silently drop existing Intel installations.
            build_args: --mac --x64 --arm64
          - os: blacksmith-4vcpu-ubuntu-2404
            platform: linux
            build_args: --linux --x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor. This runner is ephemeral; enable them for this boot so
          # the release test exercises Bubblewrap instead of skipping it.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build Windows sandbox backend
        if: runner.os == 'Windows'
        run: npm run build:sandbox:win
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          }
      - name: Test, including the real platform sandbox
        if: runner.os != 'Windows'
        run: npm test
        env:
          FLYT_RELEASE_SANDBOX_E2E: '1'
      - name: Test full suite on Windows
        if: runner.os == 'Windows'
        run: npm test
      - name: Test real Windows sandbox as a standard user
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $testUser = 'flytsandboxci'
          # Keep this at 14 characters so legacy `net user` never prompts.
          # The account exists only for this ephemeral runner job.
          $plainPassword = 'Flyt!Aa1b2C3d4'
          $testRoot = Join-Path $env:SystemDrive 'flyt-sandbox-ci'
          try {
            net user $testUser $plainPassword /add /expires:never /passwordchg:no
            if ($LASTEXITCODE -ne 0) { throw "Could not create the sandbox test user ($LASTEXITCODE)." }
            New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
            icacls.exe $testRoot /grant "${testUser}:(OI)(CI)M" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not grant the test temp directory ($LASTEXITCODE)." }
            icacls.exe $pwd.Path /grant "${testUser}:(OI)(CI)RX" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not grant repository read access ($LASTEXITCODE)." }

            & ./.github/scripts/grant-sandbox-desktop.ps1 -UserName $testUser
            $securePassword = ConvertTo-SecureString $plainPassword -AsPlainText -Force
            $credential = [pscredential]::new(".\$testUser", $securePassword)
            $stdoutPath = Join-Path $testRoot 'stdout.log'
            $stderrPath = Join-Path $testRoot 'stderr.log'
            # Alternate credentials do not inherit the runner's environment.
            $scriptPath = Join-Path $testRoot 'run-tests.cmd'
            @"
          @echo off
          set "FLYT_RELEASE_SANDBOX_E2E=1"
          set "TEMP=$testRoot"
          set "TMP=$testRoot"
          set "TMPDIR=$testRoot"
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/grant-sandbox-desktop.ps1 -CurrentLogon
          if errorlevel 1 exit /b 1
          "$((Get-Command node).Source)" --test tests/executionWorldPlatform.test.js
          exit /b %ERRORLEVEL%
          "@ | Set-Content $scriptPath -Encoding ASCII
            $process = Start-Process -FilePath $env:ComSpec `
              -ArgumentList @('/c', $scriptPath) `
              -WorkingDirectory $pwd.Path -Credential $credential -LoadUserProfile -WindowStyle Hidden -Wait -PassThru `
              -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            Get-Content $stdoutPath
            Get-Content $stderrPath
            if ($process.ExitCode -ne 0) { throw "Windows sandbox tests failed ($($process.ExitCode))." }
          }
          finally {
            net user $testUser /delete | Out-Null
          }
      - run: npm run build
      - run: npm run lint
      # Unsigned builds only: never pick up a codesigning identity on macOS.
      - name: Build installers
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install release uploader
        if: startsWith(github.ref, 'refs/tags/')
        run: npm ci --omit=dev --prefix services/updates
      # Uploads remain private until the final activation job succeeds.
      - name: Upload and verify immutable R2 assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          node services/updates/scripts/release.mjs upload --directory release \
            --version "${GITHUB_REF_NAME#v}" --platform "$RELEASE_PLATFORM" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Upload artifacts for an untagged manual build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: flyt-${{ matrix.os }}
          path: |
            release/*
            !release/*-unpacked/**
            !release/*.tmp/**
            !release/mac*/**
            !release/builder-debug.yml
            !release/builder-effective-config.yaml
          retention-days: 14

  # All platforms must be uploaded, hash-verified and from this run before beta
  # changes. Stable promotion is a separate manually dispatched workflow.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    concurrency:
      group: flyt-r2-channel-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --omit=dev --prefix services/updates
      - name: Activate complete candidate on beta
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node services/updates/scripts/release.mjs activate --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
