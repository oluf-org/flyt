name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_args: --win --x64
          - os: macos-latest
            # macos-latest is ARM today; build Intel explicitly as well so the
            # release does not silently drop existing Intel installations.
            build_args: --mac --x64 --arm64
          - os: ubuntu-latest
            build_args: --linux --x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build Windows sandbox backend
        if: runner.os == 'Windows'
        run: npm run build:sandbox:win
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          }
      - name: Test, including the real platform sandbox
        run: npm test
        env:
          FLYT_RELEASE_SANDBOX_E2E: '1'
      - run: npm run build
      - run: npm run lint
      # Unsigned builds only: never pick up a codesigning identity on macOS.
      - name: Build installers
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flyt-${{ matrix.os }}
          path: |
            release/*
            !release/*-unpacked/**
            !release/*.tmp/**
            !release/mac*/**
            !release/builder-debug.yml
            !release/builder-effective-config.yaml
          retention-days: 14

  # Publish only after every OS has built successfully. This avoids exposing a
  # half-populated release when one matrix leg fails after another has uploaded.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: flyt-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub release atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
