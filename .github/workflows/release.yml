name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-windows-2025
            build_args: --win --x64
          - os: blacksmith-6vcpu-macos-15
            # macos-latest is ARM today; build Intel explicitly as well so the
            # release does not silently drop existing Intel installations.
            build_args: --mac --x64 --arm64
          - os: blacksmith-4vcpu-ubuntu-2404
            build_args: --linux --x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor. This runner is ephemeral; enable them for this boot so
          # the release test exercises Bubblewrap instead of skipping it.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build Windows sandbox backend
        if: runner.os == 'Windows'
        run: npm run build:sandbox:win
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          }
      - name: Test, including the real platform sandbox
        if: runner.os != 'Windows'
        run: npm test
        env:
          FLYT_RELEASE_SANDBOX_E2E: '1'
      - name: Test full suite on Windows
        if: runner.os == 'Windows'
        run: npm test
      - name: Test real Windows sandbox as a standard user
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $testUser = 'flytsandboxci'
          # Keep this at 14 characters so legacy `net user` never prompts.
          # The account exists only for this ephemeral runner job.
          $plainPassword = 'Flyt!Aa1b2C3d4'
          $testRoot = Join-Path $env:SystemDrive 'flyt-sandbox-ci'
          try {
            net user $testUser $plainPassword /add /expires:never /passwordchg:no
            if ($LASTEXITCODE -ne 0) { throw "Could not create the sandbox test user ($LASTEXITCODE)." }
            New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
            icacls.exe $testRoot /grant "${testUser}:(OI)(CI)M" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not grant the test temp directory ($LASTEXITCODE)." }
            icacls.exe $pwd.Path /grant "${testUser}:(OI)(CI)RX" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not grant repository read access ($LASTEXITCODE)." }

            $stdoutPath = Join-Path $testRoot 'stdout.log'
            $stderrPath = Join-Path $testRoot 'stderr.log'
            $exitPath = Join-Path $testRoot 'exit-code.txt'
            $scriptPath = Join-Path $testRoot 'run-tests.cmd'
            @"
          @echo off
          set "FLYT_RELEASE_SANDBOX_E2E=1"
          set "TEMP=$testRoot"
          set "TMP=$testRoot"
          set "TMPDIR=$testRoot"
          cd /d "$($pwd.Path)"
          "$((Get-Command node).Source)" --test tests/executionWorldPlatform.test.js > "$stdoutPath" 2> "$stderrPath"
          echo %ERRORLEVEL% > "$exitPath"
          "@ | Set-Content $scriptPath -Encoding ASCII
            # Batch logon gives the standard user its own noninteractive
            # session, independent of the runner service's desktop ACLs.
            $action = New-ScheduledTaskAction -Execute $env:ComSpec -Argument "/c `"$scriptPath`"" -WorkingDirectory $pwd.Path
            $testUserSid = (Get-LocalUser -Name $testUser).SID.Value
            # Blacksmith's image does not grant batch logon to new users.
            # Preserve existing grants and add only this ephemeral test account.
            $policyPath = Join-Path $testRoot 'user-rights.inf'
            secedit /export /cfg $policyPath /areas USER_RIGHTS /quiet
            if ($LASTEXITCODE -ne 0) { throw 'Could not export user rights.' }
            $policy = Get-Content $policyPath -Raw
            $grant = "SeBatchLogonRight = *$testUserSid"
            if ($policy -match '(?m)^SeBatchLogonRight\s*=([^\r\n]*)') {
              $grant = "SeBatchLogonRight = $($Matches[1].Trim()),*$testUserSid"
            }
            @("[Unicode]", "Unicode=yes", "[Version]", 'signature="$CHICAGO$"', "Revision=1", "[Privilege Rights]", $grant) | Set-Content $policyPath -Encoding Unicode
            secedit /configure /db (Join-Path $testRoot 'user-rights.sdb') /cfg $policyPath /areas USER_RIGHTS /quiet
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant batch logon to the sandbox test account.' }
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 5)
            Register-ScheduledTask -TaskName $testUser -Action $action -Settings $settings -User $testUserSid -Password $plainPassword -RunLevel Limited -Force | Out-Null
            Start-ScheduledTask -TaskName $testUser
            $deadline = (Get-Date).AddMinutes(5)
            while (!(Test-Path $exitPath)) {
              if ((Get-Date) -gt $deadline) {
                Get-ScheduledTaskInfo -TaskName $testUser | Format-List
                Get-ScheduledTask -TaskName $testUser | Format-List
                Get-Content $stdoutPath, $stderrPath -ErrorAction SilentlyContinue
                throw 'Windows sandbox tests did not complete within five minutes.'
              }
              Start-Sleep -Seconds 2
            }
            Get-Content $stdoutPath
            Get-Content $stderrPath
            $testExitCode = [int](Get-Content $exitPath)
            if ($testExitCode -ne 0) { throw "Windows sandbox tests failed ($testExitCode)." }
          }
          finally {
            Get-ScheduledTask -TaskName $testUser -ErrorAction SilentlyContinue | Stop-ScheduledTask
            Unregister-ScheduledTask -TaskName $testUser -Confirm:$false -ErrorAction SilentlyContinue
            net user $testUser /delete | Out-Null
          }
      - run: npm run build
      - run: npm run lint
      # Unsigned builds only: never pick up a codesigning identity on macOS.
      - name: Build installers
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Release assets do not consume Actions artifact storage. Keep the
      # release in draft until all three platform jobs finish their uploads.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find release -maxdepth 1 -type f ! -name 'builder-debug.yml' ! -name 'builder-effective-config.yaml' -print0)
          test "${#assets[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Upload artifacts for an untagged manual build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: flyt-${{ matrix.os }}
          path: |
            release/*
            !release/*-unpacked/**
            !release/*.tmp/**
            !release/mac*/**
            !release/builder-debug.yml
            !release/builder-effective-config.yaml
          retention-days: 14

  # Publish only after every OS has built successfully. This avoids exposing a
  # half-populated release when one matrix leg fails after another has uploaded.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
