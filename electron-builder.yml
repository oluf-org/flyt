# appId and productName mirror core/brand.js (D29). productName is load-bearing:
# Electron derives userData from it, so changing it moves every install's
# settings/projects/flows — main.js carries the one-shot migration.
appId: com.olaaxe.flyt
productName: Flyt
directories:
  output: release
files:
  - dist/**
  - electron/**
  - core/**
  - src/**/*.js
  - config.json
  - package.json
  # presets/ ships the ten node templates and five pipelines as OFFERED data
  # (PIVOT-PLAN §5.1, decision 4). Read in place from inside app.asar and copied
  # into the user's library only when they click Add — never on first launch.
  #
  # flows/ and nodes/ are deliberately NOT packaged. Both stores ship empty now:
  # the library is the user's, and a bundled copy of either would be a second,
  # silently-diverging source of truth for the same definitions.
  - presets/**
  - "!**/*.map"
  - "!**/*.md"
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: olaaxe
  repo: flyt
# Icons are generated from the in-app mark's own geometry by
# `npm run icons` (scripts/make-icons.mjs) — sage on transparent. Without these
# entries packaged builds ship the default Electron icon.
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
