# appId and productName mirror core/brand.js (D29). productName is load-bearing:
# Electron derives userData from it, so changing it moves every install's
# settings/projects/flows — main.js carries the one-shot migration.
appId: com.olaaxe.flyt
productName: Flyt
directories:
  output: release
beforePack: scripts/build-before-pack.mjs
afterPack: scripts/verify-packaged-app.mjs
files:
  - dist/**
  - electron/**
  # The v2 kernel is compiled TypeScript (D53): the sources are not shipped,
  # the build output is. It is inert while the v2 flag is off, and packaging it
  # now means flipping the flag is not also a packaging change.
  - kernel/dist/**
  - core/**
  - src/**/*.js
  - config.json
  - THIRD-PARTY-NOTICES.txt
  - package.json
  # Canonical stacks ship as first-run seeds. The package-integrity hook above
  # verifies these and the declarative plugin/tool catalogs in the completed
  # app.asar so a green installer cannot silently contain an empty Library.
  - stacks/**
  - plugins/**
  - tools/**
  # main.js uses this path for the live BrowserWindow icon on Windows/Linux;
  # the target-specific icons below only brand the installer/executable.
  - build/icon.png
  # nodes/ is deliberately NOT packaged: NodeStore seeds itself from
  # SEED_NODE_TEMPLATES in code, so a bundled copy would only be a second,
  # silently-diverging source of truth for the same templates.
  - "!**/*.map"
  - "!**/*.md"
asarUnpack:
  - node_modules/@img/**
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: generic
  url: https://updates.flyt.pro/stable/
  useMultipleRangeRequest: false
# Icons are generated from the in-app mark's own geometry by
# `npm run icons` (scripts/make-icons.mjs) — sage on transparent. Without these
# entries packaged builds ship the default Electron icon.
win:
  icon: build/icon.ico
  extraResources:
    - from: kernel/native/windows/Flyt.Sandbox.Runner/bin/Release/net8.0-windows/win-x64/publish/flyt-sandbox-win.exe
      to: flyt-sandbox-win.exe
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
