version: 2
id: fable-at-home
name: "Fable at home"
description: "Refine a request, validate and repair its dependency graph, then execute ready tasks with native-tool workers."
launchable: true
presets:
  no:
    name: "No parallel work"
    description: "Run every generated task in a deterministic sequence."
    overrides:
      dispatch:
        parallelism: "no"
  low:
    name: "Low"
    description: "Parallelize only tasks that are clearly independent."
    overrides:
      dispatch:
        parallelism: "low"
  medium:
    name: "Medium"
    description: "Balance parallel throughput with dependency and write-conflict safety."
    default: true
    overrides:
      dispatch:
        parallelism: "medium"
  high:
    name: "High"
    description: "Run everything in parallel except real dependencies and write conflicts."
    overrides:
      dispatch:
        parallelism: "high"
blocks:
  - id: prompt-refiner
    use: flyt-blocks-judgement:prompt-refiner
    title: "Prompt refiner"
    config:
      modelTier: "standard"
      instructions: "Rewrite the request as a concise execution brief. Preserve explicit scope and constraints, and do not invent claims, features, benchmarks, dependencies, or acceptance thresholds. End with the concrete deliverable and a practical verification method."
  - id: dispatch
    use: flyt-blocks-core:task-graph
    title: "Plan & dispatch"
    config:
      modelTier: "standard"
      parallelism: "medium"
      minTasks: 1
      maxTasks: 12
      systemPrompt: >-
        You are the planning agent for Fable at home. Turn the execution brief into a small, concrete dependency graph of tasks that worker agents can complete. Create only tasks that contribute directly to the requested deliverable, give every task a focused goal and a practical verification method, and keep simple requests to a single task. Declare dependencies only when a task needs another task's result, name produced and required artifacts consistently, and list every file each task may modify in writeFiles. Tasks that can safely proceed without shared inputs or overlapping writes should remain independent. Do not perform the work yourself, create coordination-only or broad repository-inventory tasks, or return prose instead of the configured structured task-graph response. Use the native schema response or submit_task_graph tool when it is available.
      workerSystemPrompt: >-
        You are a dispatched execution agent for Fable at home. Complete the assigned task in the bound workspace and produce its concrete deliverable. Use native structured tools for file and shell work; never print, imitate, or merely describe a tool call. Inspect only the context needed for your task, stay within its declared writeFiles scope, preserve the user's requirements, and do not invent features, claims, or dependencies. Verify the result with the cheapest relevant project check, then report what you completed, the exact files changed, the verification performed, and any remaining uncertainty.
      workerInstructions: "Use the native structured tool interface for file and shell work; never print or imitate a tool call. Stay inside this generated task's declared write scope, verify the concrete result with the cheapest relevant project gate, and report exact files changed plus any unverified assumptions."
