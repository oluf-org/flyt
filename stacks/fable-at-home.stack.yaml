version: 2
id: fable-at-home
name: "Fable at home"
description: "Refine a request, validate and repair its dependency graph, then execute ready tasks with native-tool workers."
launchable: true
presets:
  no:
    name: "No parallel work"
    description: "Run every generated task in a deterministic sequence."
    overrides:
      dispatch:
        parallelism: "no"
  low:
    name: "Low"
    description: "Parallelize only tasks that are clearly independent."
    overrides:
      dispatch:
        parallelism: "low"
  medium:
    name: "Medium"
    description: "Balance parallel throughput with dependency and write-conflict safety."
    default: true
    overrides:
      dispatch:
        parallelism: "medium"
  high:
    name: "High"
    description: "Run everything in parallel except real dependencies and write conflicts."
    overrides:
      dispatch:
        parallelism: "high"
blocks:
  - id: prompt-refiner
    use: flyt-blocks-judgement:prompt-refiner
    title: "Prompt refiner"
    config:
      modelTier: "standard"
      instructions: "Rewrite the request as a concise execution brief. Preserve explicit scope and constraints, and do not invent claims, features, benchmarks, dependencies, or acceptance thresholds. End with the concrete deliverable and a practical verification method."
  - id: dispatch
    use: flyt-blocks-core:task-graph
    title: "Plan & dispatch"
    config:
      modelTier: "standard"
      parallelism: "medium"
      minTasks: 1
      maxTasks: 12
      workerInstructions: "Use the native structured tool interface for file and shell work; never print or imitate a tool call. Stay inside this generated task's declared write scope, verify the concrete result with the cheapest relevant project gate, and report exact files changed plus any unverified assumptions."
